# Builds the extension for Chrome and Firefox and publishes both as a GitHub release when a version tag (v0.1.0, ...)
# is pushed. The tag must match the version in package.json, which every manifest is built with.
# Actions are pinned to a commit (its version in the comment), since a tag can be moved to other code and this job
# can write releases. Dependabot updates both.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The whole history and the tags, to list the commits since the previous version in the release notes
        with:
          fetch-depth: 0
      # Node from mise.toml, as locally; pnpm from packageManager in package.json
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Check the tag matches the version
        run: |
          version="${GITHUB_REF_NAME#v}"
          actual="$(node -p "require('./package.json').version")"
          if [ "$actual" != "$version" ]; then
            echo "::error file=package.json::version is $actual, but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:release

      # The Chrome ZIP keeps the name it always had. The Firefox one is not signed by Mozilla (see docs/development.md)
      - name: Package the extension
        run: |
          (cd dist/chrome && zip -qr "../../jimaku-${GITHUB_REF_NAME}.zip" .)
          (cd dist/firefox && zip -qr "../../jimaku-firefox-${GITHUB_REF_NAME}.zip" .)

      # Which file is for which browser, with what the Firefox one can't do, where the files are downloaded. Then the
      # commits since the previous version tag (every commit for the first one), oldest first, each linked.
      # GitHub's generated notes list only pull requests, and commits here mostly go straight to main
      - name: Write the release notes
        run: |
          repo="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          previous="$(git describe --tags --abbrev=0 --match 'v*.*.*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          range="${previous:+${previous}..}${GITHUB_REF_NAME}"
          {
            echo "## Downloads"
            echo
            echo "- \`jimaku-${GITHUB_REF_NAME}.zip\`: Chrome"
            echo "- \`jimaku-firefox-${GITHUB_REF_NAME}.zip\`: Firefox 128 or later. Not signed by Mozilla, and Windows Hello / Touch ID are not supported there: the sign-in is not saved, so you sign in again after each browser restart. See [Install](${repo}/blob/${GITHUB_REF_NAME}/README.md#firefox)"
            echo
            echo "## Changes"
            echo
            git log --reverse --no-merges --format="- %s ([%h](${repo}/commit/%H))" "$range"
            if [ -n "$previous" ]; then
              echo
              echo "**Full Changelog**: ${repo}/compare/${previous}...${GITHUB_REF_NAME}"
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" "jimaku-${GITHUB_REF_NAME}.zip" "jimaku-firefox-${GITHUB_REF_NAME}.zip"
          --verify-tag --title "Jimaku ${GITHUB_REF_NAME}" --notes-file release-notes.md
