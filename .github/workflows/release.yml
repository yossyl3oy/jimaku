# Builds the extension and publishes it as a GitHub release when a version tag (v0.1.0, ...) is pushed.
# The tag must match the version in package.json and public/manifest.json.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        # The whole history and the tags, to list the commits since the previous version in the release notes
        with:
          fetch-depth: 0
      # Node from mise.toml, as locally; pnpm from packageManager in package.json
      - uses: jdx/mise-action@v5
      - uses: pnpm/action-setup@v6

      - name: Check the tag matches the version
        run: |
          version="${GITHUB_REF_NAME#v}"
          for file in package.json public/manifest.json; do
            actual="$(node -p "require('./$file').version")"
            if [ "$actual" != "$version" ]; then
              echo "::error file=$file::version is $actual, but the tag is $GITHUB_REF_NAME"
              exit 1
            fi
          done

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:release

      - name: Package the extension
        run: cd dist && zip -qr "../jimaku-${GITHUB_REF_NAME}.zip" .

      # The commits since the previous version tag (every commit for the first one), oldest first, each linked.
      # GitHub's generated notes list only pull requests, and commits here mostly go straight to main
      - name: Write the release notes
        run: |
          repo="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          previous="$(git describe --tags --abbrev=0 --match 'v*.*.*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          range="${previous:+${previous}..}${GITHUB_REF_NAME}"
          {
            echo "## Changes"
            echo
            git log --reverse --no-merges --format="- %s ([%h](${repo}/commit/%H))" "$range"
            if [ -n "$previous" ]; then
              echo
              echo "**Full Changelog**: ${repo}/compare/${previous}...${GITHUB_REF_NAME}"
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" "jimaku-${GITHUB_REF_NAME}.zip"
          --verify-tag --title "Jimaku ${GITHUB_REF_NAME}" --notes-file release-notes.md
